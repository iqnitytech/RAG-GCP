[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-sdk"
version = "0.1.0"
description = "Shared FastAPI/GCP building blocks: auth, schemas, logging, middleware, errors, probes."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "google-auth",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["sdk*"]

